display_information:
  name: Leto
  description: Vladimir's personal AI assistant — briefs, proposals, and slash commands
  background_color: "#1a1a1a"
  long_description: |
    Leto is a personal automation layer that runs locally on Vladimir's machine.
    v0: outbound-only bot identity for scheduled Slack DMs (daily brief, weekly
    review, Notion alignment proposals, EOD reconciliation). v1 (this version):
    adds Socket Mode listener + /leto slash commands so Vladimir can trigger Leto
    from any Slack client without opening Claude Code.
features:
  bot_user:
    display_name: Leto
    always_online: false
  slash_commands:
    - command: /leto
      url: https://example.com/slack/commands
      description: Your personal AI assistant
      usage_hint: "today | draft <permalink> | apply-backlog | apply-notion | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
